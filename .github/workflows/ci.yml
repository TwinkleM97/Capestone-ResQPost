name: CI
on:
  push:
  pull_request:

jobs:
  integration:
    name: Integration (docker compose)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Ensure docker compose + curl available (GitHub & nektos/act)
      - name: Ensure docker compose & curl
        shell: bash
        run: |
          set -euo pipefail
          if ! docker compose version >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            else
              apt-get update
              apt-get install -y docker-compose-plugin
            fi
          fi
          if ! command -v curl >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y curl
            else
              apt-get update
              apt-get install -y curl
            fi
          fi

      - name: Write docker-compose.ci.yml
        shell: bash
        run: |
          cat > docker-compose.ci.yml <<'YAML'
          services:
            db:
              image: postgres:15-alpine
              environment:
                POSTGRES_DB: resqpost
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
              ports:
                - "5433:5432"   # host publish helps under `act --network host`
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres -d resqpost || exit 1"]
                interval: 10s
                timeout: 5s
                retries: 10

            backend:
              image: resqpost-backend:ci
              environment:
                DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/resqpost
                PYTHONUNBUFFERED: "1"
              depends_on:
                db:
                  condition: service_healthy
              ports:
                - "5000:5000"

            frontend:
              image: resqpost-frontend:ci
              # If your image serves with nginx on port 80, change to: "3000:80"
              ports:
                - "3000:3000"
              environment:
                HOST: 0.0.0.0
                PORT: 3000
                REACT_APP_API_URL: http://backend:5000
              depends_on:
                - backend
              healthcheck:
                # Try dev server on 3000; if not, try nginx on 80
                test: ["CMD-SHELL", "(curl -fsS http://localhost:3000/ || curl -fsS http://localhost/) >/dev/null || exit 1"]
                interval: 10s
                timeout: 5s
                retries: 24
          YAML

      # Build images explicitly to avoid buildx/bake "failed to find target default"
      - name: Build backend image
        run: docker build -t resqpost-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t resqpost-frontend:ci ./frontend

      - name: Up (start, detached)
        run: docker compose -f docker-compose.ci.yml up -d

      # More robust frontend wait: try port 3000, then 80; show logs if it fails
      - name: Wait for frontend healthy (HTTP 2xx)
        shell: bash
        run: |
          set -e
          URL1="http://localhost:3000/"
          URL2="http://localhost/"
          deadline=$((SECONDS+240))  # up to 4 minutes (matches healthcheck retries)
          until code=$(curl -s -o /dev/null -w "%{http_code}" "$URL1"); do
            if [ $SECONDS -ge $deadline ]; then
              echo "Timed out waiting for frontend on $URL1"
              docker compose -f docker-compose.ci.yml ps || true
              docker compose -f docker-compose.ci.yml logs frontend --no-color || true
              exit 1
            fi
            echo "[wait] frontend not reachable yet on 3000..."
            sleep 5
          done
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            # Try alternate port 80 (nginx-based images)
            code2=$(curl -s -o /dev/null -w "%{http_code}" "$URL2" || echo 000)
            if [ "$code2" -lt 200 ] || [ "$code2" -ge 400 ]; then
              echo "Expected 2xx from frontend (${URL1} or ${URL2}); got $code / $code2"
              docker compose -f docker-compose.ci.yml ps || true
              docker compose -f docker-compose.ci.yml logs frontend --no-color || true
              exit 1
            fi
          fi

      - name: Wait for Postgres healthy
        shell: bash
        run: |
          set -e
          timeout 60 bash -c '
            until docker compose -f docker-compose.ci.yml exec -T db pg_isready -U postgres -d resqpost; do
              echo "[wait] postgres not ready yet..."
              sleep 2
            done
          '

      - name: Initialize DB schema inside backend
        shell: bash
        run: |
          docker compose -f docker-compose.ci.yml exec -T backend python - <<'PY'
          from app import app, db
          with app.app_context():
              db.create_all()
              print("[ci] create_all done")
          PY

      - name: Smoke insert (optional)
        shell: bash
        run: |
          docker compose -f docker-compose.ci.yml exec -T backend python - <<'PY'
          from app import app, db
          from models import Alert
          with app.app_context():
              a = Alert(title='ci-smoke', description='ok', category='pet', location='ci')
              db.session.add(a); db.session.commit()
              print("[ci] inserted one alert")
          PY

      - name: Wait for backend HTTP 200 on /api/alerts
        shell: bash
        run: |
          set -e
          timeout 90 bash -c '
            until code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/alerts); do
              echo "[wait] backend not reachable yet..."
              sleep 2
            done
            if [ "$code" -ne 200 ]; then
              echo "Expected 200 from /api/alerts, got $code"
              docker compose -f docker-compose.ci.yml logs backend --no-color || true
              exit 1
            fi
          '

      - name: Verify API returns data (print first 1KB)
        run: curl -sS http://localhost:5000/api/alerts | head -c 1000; echo

      - name: Dump compose status & logs on failure
        if: ${{ failure() }}
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color || true

      - name: Teardown
        if: ${{ always() }}
        run: docker compose -f docker-compose.ci.yml down -v
